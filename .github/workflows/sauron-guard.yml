name: CEO Sauron Guard & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  sauron-guard:
    name: sauron-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable CEO Sauron identity
        run: npm run verify:sauron

      - name: Typecheck and build production bundle
        run: npm run build
